server:
  port: 8080

spring:
  application:
    name: ingestion-service

  # Datasource is env-driven so the same jar runs locally and in Docker Compose.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ingestion}
    username: ${DB_USER:ingestion}
    password: ${DB_PASSWORD:ingestion}

  jpa:
    hibernate:
      # Fine for an assignment; a real deployment would use Flyway/Liquibase migrations.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Directory of declarative source definitions loaded at startup.
ingestion:
  sources-dir: ${INGESTION_SOURCES_DIR:sources}
  http:
    # Connect and read timeout applied to every outbound fetch.
    timeout: ${INGESTION_HTTP_TIMEOUT:10s}
  object-store:
    # Local-disk stand-in for S3, used by S3Sink via ObjectStoreClient. Swap
    # LocalFileObjectStoreClient for a real S3-backed implementation to point
    # this at an actual bucket with no change to S3Sink or the engine.
    root: ${INGESTION_OBJECT_STORE_ROOT:object-store}
    bucket: ${INGESTION_OBJECT_STORE_BUCKET:ingestion-records}
